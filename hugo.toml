# Voltra Exercise Maker: Hugo site config. Theme: themes/hugo-breeze-plasma-inspired-theme (vendored copy, the same
# theme and settings as danielsada.tech and ninja.danielsada.tech, so the sites look and navigate alike; see README.md).
# Requires Hugo >= 0.158 (built and deployed with 0.170.1). Deployed by Cloudflare Pages (README.md > Deploy).
baseURL = "https://voltra.danielsada.tech/"
title = "Voltra Exercise Maker"
theme = "hugo-breeze-plasma-inspired-theme"
locale = "en-US"
defaultContentLanguage = "en"
capitalizeListTitles = false
# No posts here: without this Hugo picks the root pages as the main section and the theme renders them as blog posts.
mainSections = ["none"]

enableRobotsTXT = true   # layouts/robots.txt (points to the sitemap)
# A tool site, not a blog: no posts, feeds or taxonomies.
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  minifyOutput = true

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true

[params]
  description = "A hobby page for Beyond Power VOLTRA I owners: an exercise composer that fits your equipment, plus Tabata and interval timers."
  tagline = "Voltra timers & exercise composer"
  logo = "images/DanielSadaLogo.png"
  favicon = "favicon.ico"
  ogimage = "images/og-image.png"
  crumbroot = "Voltra Exercise Maker"
  # Site-wide <meta name="keywords"> (pages can set their own), rendered by hooks/head-end.html.
  keywords = ["Voltra", "Beyond Power VOLTRA I", "Voltra exercises", "Voltra workouts", "Tabata timer", "interval timer", "cable workout"]
  colorscheme = "auto"
  homeurl = "https://danielsada.tech/"   # the panel logo links back to the blog (theme param)
  repo = "https://github.com/danielsada/voltra-exercise-maker"
  [params.author]
    name = "Daniel Sada"
    email = "hello@danielsada.tech"
    emaillabel = "hello [at] danielsada.tech"
    page = "/equipment"

  # Same colours as danielsada.tech (logo purple).
  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.panel]
    width = "17rem"
  # This site's own panel sections, below Places, in order (layouts/_partials/breeze/panel-projects.html):
  # {menu, title} = a list of [[menus.<menu>]] (no title = a plain list); {partial} = a site-specific partial.
  [[params.panel.sections]]
    menu = "voltra"
    title = "Voltra"
  [[params.panel.sections]]
    partial = "voltra/panel-workout.html"
  [[params.panel.sections]]
    menu = "guide"
  [[params.panel.sections]]
    partial = "voltra/panel-install.html"

  [params.rss]
    panel = false

  # The home page is the composer, as a home widget (layouts/_partials/home/composer.html).
  [params.home]
    side = []   # no side column (the theme's defaults would add empty project/talk widgets)
    [[params.home.main]]
      widget = "composer"

  [params.post]
    progress = false


  # Voltra-specific settings (layouts/_partials/voltra/*, assets/js/*).
  [params.voltra]
    official = "https://www.beyond-power.com/"
    help = "https://help.beyond-power.com/"

[menus]
  # Places: the same entries as danielsada.tech (absolute links), so the sites share one navigation.
  [[menus.main]]
    name = "All posts"
    url = "https://danielsada.tech/posts/"
    weight = 10
    [menus.main.params]
      icon = "blog"
  [[menus.main]]
    name = "Notas"
    url = "https://danielsada.tech/notas/"
    weight = 20
    [menus.main.params]
      icon = "notas"
      badge = "ES"
      lang = "es"
  [[menus.main]]
    name = "Projects"
    url = "https://danielsada.tech/projects/"
    weight = 30
    [menus.main.params]
      icon = "apps"
  [[menus.main]]
    name = "About"
    url = "https://danielsada.tech/about/"
    weight = 40
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    name = "Contact"
    url = "mailto:hello@danielsada.tech"
    weight = 50
    [menus.main.params]
      icon = "mail"

  # This site's own pages (see params.panel.sections). The logo links to danielsada.tech; the composer is this
  # site's home page (content/_index.md), so it comes first, with the home icon.
  [[menus.voltra]]
    name = "Timer"
    pageRef = "/timer"
    weight = 10
    [menus.voltra.params]
      icon = "timer"
  [[menus.voltra]]
    name = "Composer"
    pageRef = "/"
    weight = 5
    [menus.voltra.params]
      icon = "home"
  [[menus.voltra]]
    name = "Exercises"
    pageRef = "/exercises"
    weight = 30
    [menus.voltra.params]
      icon = "folder"

  [[menus.guide]]
    name = "Anchors & attachments"
    pageRef = "/equipment"
    weight = 10
    [menus.guide.params]
      icon = "info"

  # Elsewhere, the same as danielsada.tech, with the blog's feed. Its http(s) links are also the JSON-LD Person's
  # sameAs (layouts/_partials/hooks/head-end.html).
  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/danielsada"
    weight = 10
    [menus.social.params]
      icon = "github"
  [[menus.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/danielsadac"
    weight = 20
    [menus.social.params]
      icon = "linkedin"
  [[menus.social]]
    name = "Fediverse"
    url = "https://infosec.exchange/@dsada"
    weight = 30
    [menus.social.params]
      icon = "globe"
  [[menus.social]]
    name = "RSS feed"
    url = "https://danielsada.tech/index.xml"
    weight = 40
    [menus.social.params]
      icon = "rss"
