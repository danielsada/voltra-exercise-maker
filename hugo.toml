# Voltra Exercise Maker: Hugo site config. Theme: themes/hugo-breeze-plasma-inspired-theme (vendored copy, the same
# theme and settings as danielsada.tech and ninja.danielsada.tech, so the sites look and navigate alike; see README.md).
# Requires Hugo >= 0.158 (built and deployed with 0.170.1; see README.md > Deploy).
baseURL = "https://danielsada.github.io/voltra-exercise-maker/"
title = "Voltra Exercise Maker"
theme = "hugo-breeze-plasma-inspired-theme"
locale = "en-US"
defaultContentLanguage = "en"
capitalizeListTitles = false
# No posts here: without this Hugo picks the root pages as the main section and the theme renders them as blog posts.
mainSections = ["none"]

enableRobotsTXT = true
# A tool site, not a blog: no posts, feeds or taxonomies.
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  minifyOutput = true

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true

[params]
  description = "A hobby page for planning Beyond Power VOLTRA I workouts: Tabata and interval timers, and an exercise composer that only picks what your Voltras, handles and anchors allow. Not affiliated with Beyond Power."
  tagline = "Voltra timers & exercise composer"
  logo = "images/DanielSadaLogo.png"
  favicon = "favicon.ico"   # no leading slash: relative to baseURL, which is a sub-path
  ogimage = "images/og-image.png"
  crumbroot = "Voltra Exercise Maker"
  colorscheme = "auto"
  # The main site; linked from Places and the home page.
  mainsite = "https://danielsada.tech/"
  repo = "https://github.com/danielsada/voltra-exercise-maker"
  [params.author]
    name = "Daniel Sada"
    email = "hello@danielsada.tech"
    emaillabel = "hello [at] danielsada.tech"
    page = "/equipment"

  # Same colours as danielsada.tech (logo purple).
  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.panel]
    width = "17rem"
  # This site's own panel sections, below Places: the tools (menus.voltra), then menus.guide without a title
  # (layouts/_partials/breeze/panel-projects.html), like ninja.danielsada.tech.
  [[params.panel.sections]]
    menu = "voltra"
    title = "Voltra"
  [[params.panel.sections]]
    menu = "guide"

  [params.rss]
    panel = false

  [params.post]
    progress = false

  [params.home]
    [[params.home.main]]
      widget = "intro"
    [[params.home.main]]
      widget = "quickstart"
      title = "Start training"
    [[params.home.side]]
      widget = "disclaimer"
      title = "Hobby project"
    [[params.home.side]]
      widget = "mainsite"
      title = "From danielsada.tech"

  # Voltra-specific settings (layouts/_partials/voltra/*, assets/js/*).
  [params.voltra]
    official = "https://www.beyond-power.com/"
    help = "https://help.beyond-power.com/"

[menus]
  # Places: the same entries as danielsada.tech (absolute links), so the sites share one navigation.
  [[menus.main]]
    name = "All posts"
    url = "https://danielsada.tech/posts/"
    weight = 10
    [menus.main.params]
      icon = "blog"
  [[menus.main]]
    name = "Notas"
    url = "https://danielsada.tech/notas/"
    weight = 20
    [menus.main.params]
      icon = "notas"
      badge = "ES"
      lang = "es"
  [[menus.main]]
    name = "Projects"
    url = "https://danielsada.tech/projects/"
    weight = 30
    [menus.main.params]
      icon = "apps"
  [[menus.main]]
    name = "About"
    url = "https://danielsada.tech/about/"
    weight = 40
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    name = "Contact"
    url = "mailto:hello@danielsada.tech"
    weight = 50
    [menus.main.params]
      icon = "mail"

  # This site's own pages (see params.panel.sections).
  [[menus.voltra]]
    name = "Timer"
    pageRef = "/timer"
    weight = 10
    [menus.voltra.params]
      icon = "timer"
  [[menus.voltra]]
    name = "Composer"
    pageRef = "/composer"
    weight = 20
    [menus.voltra.params]
      icon = "dumbbell"
  [[menus.voltra]]
    name = "Exercises"
    pageRef = "/exercises"
    weight = 30
    [menus.voltra.params]
      icon = "folder"

  [[menus.guide]]
    name = "Anchors & attachments"
    pageRef = "/equipment"
    weight = 10
    [menus.guide.params]
      icon = "info"

  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/danielsada"
    weight = 10
    [menus.social.params]
      icon = "github"
  [[menus.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/danielsadac"
    weight = 20
    [menus.social.params]
      icon = "linkedin"
  [[menus.social]]
    name = "X (Twitter)"
    url = "https://x.com/danielsadac"
    weight = 30
    [menus.social.params]
      icon = "x"
